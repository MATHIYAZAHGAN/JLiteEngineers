<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#17385f"/>
    </linearGradient>
    
    <!-- Metallic 24K Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Electric Lightning Core -->
    <linearGradient id="favVolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="2"/>

  <!-- Subtle Circuit Track Accent -->
  <path d="M8 32 H56" stroke="url(#favGold)" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.2"/>

  <!-- 'J' Monogram: Top Bar + Vertical Stem + Curved Terminal Hook -->
  <path d="M12 15 H29" 
        stroke="url(#favGold)" 
        stroke-width="5.2" 
        stroke-linecap="round"
        filter="url(#favGlow)"/>
  <path d="M22 15 V38 C22 45.5 17 49 11 47" 
        stroke="url(#favGold)" 
        stroke-width="5.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#favGlow)"/>

  <!-- 'L' Monogram: Vertical Stem + Engineered 45° Foot -->
  <path d="M34 15 V43 H52 L55 39" 
        stroke="url(#favGold)" 
        stroke-width="5.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#favGlow)"/>

  <!-- 33kV Electrical Power Lightning Bolt Core -->
  <path d="M31 17 L25 30 H33 L27 44 L40 28 H32 L36 17 Z" 
        fill="url(#favVolt)"
        filter="url(#favGlow)"/>

  <!-- Terminal Star Spark -->
  <circle cx="52" cy="18" r="2.2" fill="#ffffff" filter="url(#favGlow)"/>
</svg>
