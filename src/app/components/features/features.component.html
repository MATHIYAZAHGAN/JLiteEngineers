<section id="features" class="px-3.5 sm:px-6 relative overflow-hidden py-10 sm:py-12 lg:py-14" style="background: linear-gradient(180deg, #fafbfc 0%, #ffffff 100%);">
  <!-- Decorative Elements -->
  <div class="absolute inset-0 dot-pattern pointer-events-none" style="opacity: 0.35;"></div>
  
  <!-- Top Wave Separator -->
  <div class="absolute top-0 left-0 right-0 h-16 pointer-events-none" style="background: linear-gradient(180deg, rgba(10, 22, 40, 0.03) 0%, transparent 100%);"></div>
  
  <!-- Premium Gold Top Border -->
  <div class="absolute top-0 left-0 right-0 h-1 overflow-hidden">
    <div style="height: 100%; background: linear-gradient(90deg, transparent 0%, #f59e0b 25%, #fbbf24 50%, #fcd34d 75%, transparent 100%); animation: shimmer 3s ease-in-out infinite;"></div>
  </div>
  
  <div class="max-w-7xl mx-auto relative z-10">
    <!-- Section Header -->
    <div class="text-center mb-8 sm:mb-10">
      <div appScrollReveal class="flex items-center justify-center gap-2.5 sm:gap-3 mb-3 sm:mb-4">
        <div class="h-[2px] w-8 sm:w-12" style="background: linear-gradient(90deg, transparent, #f59e0b);"></div>
        <span style="display: inline-flex; align-items: center; gap: 7px; font-family: 'Outfit', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; color: #ea8c00; background: #fef3c7; border: 1px solid rgba(245, 158, 11, 0.4);">WHY JLITE ENGINEERS</span>
        <div class="h-[2px] w-8 sm:w-12" style="background: linear-gradient(90deg, #f59e0b, transparent);"></div>
      </div>
      <h2 appScrollReveal [stagger]="100" class="font-heading font-bold leading-tight mt-2"
          style="font-size:clamp(1.85rem,3.5vw,3rem);color:#0a1628;letter-spacing:-0.02em;">
        Built for <span style="background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: inline-block;">Professionals</span>
      </h2>
      <p appScrollReveal [stagger]="200" class="font-body mt-3 max-w-2xl mx-auto leading-relaxed text-sm sm:text-base text-slate-600">
        Trusted by electrical contractors, MEP engineers, and facility managers across 40+ countries.
      </p>
    </div>

    <!-- Feature Cards - Premium Light Theme with Vibrant Gold -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5 lg:gap-6">
      <div *ngFor="let f of features; let i = index" appScrollReveal [stagger]="i * 80"
           class="group press p-5 sm:p-6 flex flex-col gap-3.5 sm:gap-4 rounded-2xl transition-all duration-400 relative overflow-hidden" 
           style="background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px rgba(10, 22, 40, 0.06), 0 1px 3px rgba(10, 22, 40, 0.03);"
           onmouseenter="this.style.borderColor='rgba(245, 158, 11, 0.5)'; this.style.boxShadow='0 12px 32px rgba(245, 158, 11, 0.18), 0 4px 12px rgba(245, 158, 11, 0.1)'; this.style.transform='translateY(-6px)';"
           onmouseleave="this.style.borderColor='#e2e8f0'; this.style.boxShadow='0 4px 12px rgba(10, 22, 40, 0.06), 0 1px 3px rgba(10, 22, 40, 0.03)'; this.style.transform='translateY(0)';">
        
        <!-- Top gold accent bar (visible on hover) -->
        <div class="absolute top-0 left-0 right-0 h-1 transition-opacity duration-400 opacity-0 group-hover:opacity-100"
             style="background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%);"></div>
        
        <div class="w-16 h-16 rounded-xl flex items-center justify-center group-hover:scale-110 transition-all duration-400 flex-shrink-0"
             style="background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3), 0 2px 8px rgba(245, 158, 11, 0.15);">
          <svg *ngIf="f.icon === 'certified'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
          <svg *ngIf="f.icon === 'smart'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
          <svg *ngIf="f.icon === 'warranty'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
          <svg *ngIf="f.icon === 'delivery'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        </div>
        <div>
          <h3 class="font-heading font-bold text-lg mb-3 group-hover:text-transparent group-hover:bg-clip-text transition-all duration-400" 
              style="color: #0a1628;"
              onmouseenter="this.style.background='linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%)'; this.style.webkitBackgroundClip='text'; this.style.webkitTextFillColor='transparent';"
              onmouseleave="this.style.background='none'; this.style.webkitTextFillColor='#0a1628';">{{ f.title }}</h3>
          <p class="font-body text-sm leading-relaxed" style="color: #64748b;">{{ f.desc }}</p>
        </div>
      </div>
    </div>

    <!-- Trust Bar - Enhanced with Vibrant Gold -->
    <div appScrollReveal [stagger]="200" class="mt-12 sm:mt-16 pt-8 sm:pt-12 flex flex-wrap items-center justify-center gap-4 sm:gap-6 md:gap-10"
         style="border-top:2px solid #e2e8f0;">
      <div *ngFor="let t of trustItems" class="flex items-center gap-2.5 sm:gap-3 group cursor-default" style="color:#64748b;">
        <div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform duration-300" 
             style="background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%); box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);">
          <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="font-body text-xs sm:text-sm font-semibold group-hover:text-navy-deep transition-colors duration-300">{{ t }}</span>
      </div>
    </div>

    <!-- Photo Carousel with Side Scrolling -->
    <div appScrollReveal [stagger]="250" class="mt-12 sm:mt-16 relative">

      <!-- Carousel Header Controls -->
      <div class="flex items-center justify-between mb-4 sm:mb-5 px-1">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full" style="background: linear-gradient(135deg, #f59e0b, #fbbf24); box-shadow: 0 0 10px rgba(245,158,11,0.6);"></span>
          <h3 class="font-heading font-bold text-sm sm:text-base text-slate-800">On-Site Project & Installation Highlights</h3>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 font-bold border border-amber-200/60 hidden sm:inline-block">10 Projects</span>
        </div>

        <!-- Left/Right Scroll Arrow Buttons -->
        <div class="flex items-center gap-2">
          <button type="button" (click)="scrollLeft()"
                  class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white border border-slate-200 text-slate-700 hover:text-amber-600 hover:border-amber-400 hover:bg-amber-50/50 flex items-center justify-center transition-all duration-200 shadow-sm active:scale-95 cursor-pointer"
                  title="Scroll Left" aria-label="Scroll left in gallery">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <button type="button" (click)="scrollRight()"
                  class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white border border-slate-200 text-slate-700 hover:text-amber-600 hover:border-amber-400 hover:bg-amber-50/50 flex items-center justify-center transition-all duration-200 shadow-sm active:scale-95 cursor-pointer"
                  title="Scroll Right" aria-label="Scroll right in gallery">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Floating Left/Right Arrow Overlays on the Carousel Track -->
      <button type="button" (click)="scrollLeft()"
              class="hidden md:flex absolute left-3 top-1/2 -translate-y-1/2 z-20 w-11 h-11 rounded-full items-center justify-center transition-all duration-300 cursor-pointer shadow-xl opacity-90 hover:opacity-100 hover:scale-110 active:scale-95"
              style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border: 1.5px solid rgba(245, 158, 11, 0.4); color: #0b1d3a;"
              aria-label="Previous photos">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <button type="button" (click)="scrollRight()"
              class="hidden md:flex absolute right-3 top-1/2 -translate-y-1/2 z-20 w-11 h-11 rounded-full items-center justify-center transition-all duration-300 cursor-pointer shadow-xl opacity-90 hover:opacity-100 hover:scale-110 active:scale-95"
              style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border: 1.5px solid rgba(245, 158, 11, 0.4); color: #0b1d3a;"
              aria-label="Next photos">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>

      <!-- Scrollable Track with Smooth Touch & Mouse Drag -->
      <div #carousel
           class="flex gap-3.5 sm:gap-4 overflow-x-auto scroll-smooth snap-x snap-mandatory rounded-2xl pb-2 pt-1 px-1"
           style="scrollbar-width: none; -ms-overflow-style: none;">
        
        <div *ngFor="let photo of workPhotos; let idx = index"
             (click)="openLightbox(photo.img, photo.title, $event)"
             class="group flex-shrink-0 w-[260px] sm:w-[300px] md:w-[320px] snap-start rounded-2xl overflow-hidden border border-slate-200 bg-white relative transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl cursor-pointer"
             style="box-shadow: 0 4px 16px rgba(10, 22, 40, 0.06);">
          
          <!-- Image Container -->
          <div class="relative overflow-hidden aspect-[4/3] bg-slate-900">
            <img [src]="photo.img" [alt]="photo.title"
                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                 loading="lazy"/>
            
            <!-- Hover Gold Gradient Overlay with Zoom Icon -->
            <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center"
                 style="background: linear-gradient(135deg, rgba(11, 29, 58, 0.6) 0%, rgba(245, 158, 11, 0.35) 100%);">
              <div class="w-11 h-11 rounded-full flex items-center justify-center transform scale-90 group-hover:scale-100 transition-transform duration-300 border-2 border-white/80 shadow-lg"
                   style="background: rgba(255, 255, 255, 0.95);">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="11" y1="8" x2="11" y2="14"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
              </div>
            </div>

            <!-- Top Tag Badge -->
            <div class="absolute top-2.5 left-2.5">
              <span class="px-2 py-0.5 rounded-full text-[0.65rem] font-bold tracking-wide"
                    style="background: rgba(11, 29, 58, 0.75); color: #fbbf24; backdrop-filter: blur(6px); border: 1px solid rgba(245, 158, 11, 0.3);">
                {{ photo.tag }}
              </span>
            </div>
          </div>

          <!-- Card Caption -->
          <div class="p-3 bg-white flex items-center justify-between border-t border-slate-100">
            <p class="font-heading font-bold text-xs sm:text-sm text-slate-800 truncate" [title]="photo.title">
              {{ photo.title }}
            </p>
            <span class="text-[0.68rem] font-semibold text-amber-600 flex items-center gap-1 group-hover:translate-x-0.5 transition-transform flex-shrink-0 ml-2">
              <span>View</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
              </svg>
            </span>
          </div>

        </div>

      </div>

      <!-- Lightbox Modal -->
      <div *ngIf="lightboxImg()" 
           class="fixed inset-0 z-[9999] flex items-center justify-center p-3 sm:p-6 animate-fade-in"
           style="background: rgba(5, 12, 25, 0.94); backdrop-filter: blur(12px);" 
           (click)="closeLightbox()">
        
        <!-- Screen-Fixed Top-Right Close Button (ALWAYS VISIBLE ABOVE ALL NAVBARS/CONTENT) -->
        <button type="button"
                class="fixed top-4 right-4 sm:top-6 sm:right-8 z-[10000] px-4 py-2.5 rounded-full bg-slate-900/95 text-white border-2 border-amber-400 hover:bg-red-600 hover:border-red-400 transition-all duration-200 flex items-center gap-2 shadow-2xl cursor-pointer hover:scale-105 active:scale-95"
                (click)="closeLightbox(); $event.stopPropagation()"
                title="Close (Esc)" aria-label="Close image">
          <svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
          <span class="text-xs sm:text-sm font-bold text-white tracking-wide">Close (Esc)</span>
        </button>

        <!-- Modal Dialog Container -->
        <div class="relative max-w-4xl w-full flex flex-col items-center justify-center my-auto" (click)="$event.stopPropagation()">
          
          <!-- In-card Top-Right Close Button -->
          <button type="button"
                  class="absolute top-3 right-3 z-30 w-10 h-10 rounded-full bg-slate-950/85 hover:bg-red-600 text-white transition-all flex items-center justify-center shadow-xl border border-white/30 cursor-pointer hover:scale-110 active:scale-95"
                  (click)="closeLightbox()" aria-label="Close image">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

          <!-- Image -->
          <div class="w-full overflow-hidden rounded-2xl border border-white/20 shadow-2xl bg-slate-950 flex items-center justify-center max-h-[78vh]">
            <img [src]="lightboxImg()!" [alt]="lightboxTitle()"
                 class="w-full h-auto max-h-[76vh] object-contain mx-auto" />
          </div>

          <!-- Bottom Title & Dismiss Cue -->
          <div class="mt-3.5 flex flex-col sm:flex-row items-center justify-between w-full px-2 gap-2 text-center sm:text-left">
            <p class="text-white font-heading font-bold text-sm sm:text-base leading-snug">{{ lightboxTitle() }}</p>
            <button type="button" (click)="closeLightbox()"
                    class="text-xs text-amber-400 hover:text-white underline font-semibold cursor-pointer transition-colors">
              Click anywhere outside or press ESC to close
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
