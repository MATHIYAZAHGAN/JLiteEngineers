<!-- Mobile Bottom Sticky Navigation Bar -->
<div class="md:hidden fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 text-slate-400 z-[90] px-4 py-2.5 flex items-center justify-around shadow-2xl">
  <button (click)="scrollToSection('hero')" class="flex flex-col items-center gap-1 hover:text-amber-400 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
    </svg>
    <span class="text-[0.65rem] font-bold uppercase tracking-wider">Home</span>
  </button>

  <button (click)="scrollToSection('products')" class="flex flex-col items-center gap-1 hover:text-amber-400 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 11h14l1 12H4L5 11z" />
    </svg>
    <span class="text-[0.65rem] font-bold uppercase tracking-wider">Products</span>
  </button>

  <button (click)="scrollToSection('contractors')" class="flex flex-col items-center gap-1 hover:text-amber-400 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
    </svg>
    <span class="text-[0.65rem] font-bold uppercase tracking-wider">Contractors</span>
  </button>

  <button (click)="cartService.openCart()" class="flex flex-col items-center gap-1 relative hover:text-amber-400 transition">
    <div class="relative">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
      <span *ngIf="cartService.cartCount() > 0" class="absolute -top-1.5 -right-2.5 w-4 h-4 rounded-full bg-amber-500 text-slate-950 font-black text-[0.6rem] flex items-center justify-center animate-pulse">
        {{ cartService.cartCount() }}
      </span>
    </div>
    <span class="text-[0.65rem] font-bold uppercase tracking-wider">Cart</span>
  </button>

  <button (click)="scrollToSection('contact')" class="flex flex-col items-center gap-1 hover:text-amber-400 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
    </svg>
    <span class="text-[0.65rem] font-bold uppercase tracking-wider">Contact</span>
  </button>
</div>
