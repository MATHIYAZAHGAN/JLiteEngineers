<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001f54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a3d80;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0C040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Premium Navy Background with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#navyGrad)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- JLITE Brand Mark - Bold JL Letters -->
  <text x="32" y="44" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="32" 
        font-weight="900" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="-2">JL</text>
  
  <!-- Premium Gold Accent Line -->
  <rect x="10" y="52" width="44" height="3" rx="1.5" fill="url(#goldGrad)" opacity="0.9"/>
  
  <!-- Electrical Circuit Element (subtle) -->
  <circle cx="16" cy="16" r="2.5" fill="#FFD700" opacity="0.4"/>
  <circle cx="48" cy="16" r="2.5" fill="#FFD700" opacity="0.4"/>
  <line x1="16" y1="16" x2="48" y2="16" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
</svg>
