<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <!-- Premium Navy Gradient - Deep Professional -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001f54;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#003875;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a3d80;stop-opacity:1" />
    </linearGradient>
    
    <!-- Luxurious Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFED4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4A300;stop-opacity:1" />
    </linearGradient>
    
    <!-- Premium Shine Effect for Depth -->
    <radialGradient id="shine" cx="35%" cy="25%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Subtle Vignette for Premium Look -->
    <radialGradient id="vignette" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>
  </defs>
  
  <!-- Premium Navy Background -->
  <rect width="180" height="180" rx="40" fill="url(#navyGrad)"/>
  
  <!-- Shine Effect Overlay for Luxury Feel -->
  <ellipse cx="60" cy="50" rx="80" ry="70" fill="url(#shine)"/>
  
  <!-- Vignette Edge Darkening -->
  <rect width="180" height="180" rx="40" fill="url(#vignette)"/>
  
  <!-- JLITE Brand Mark - Ultra-Bold, Modern "JL" -->
  <text x="90" y="120" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="82" 
        font-weight="900" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="-4"
        style="paint-order: stroke; stroke: rgba(0,31,84,0.4); stroke-width: 1.5px;">JL</text>
  
  <!-- Premium Gold Accent Line with Subtle Animation -->
  <rect x="32" y="142" width="116" height="6" rx="3" fill="url(#goldGrad)" opacity="0.95">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Ultra-Subtle Border Glow for Polish -->
  <rect width="180" height="180" rx="40" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.2"/>
</svg>
