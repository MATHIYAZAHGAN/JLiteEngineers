<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001f54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a3d80;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0C040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle shine effect -->
    <radialGradient id="shine" cx="40%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Premium Navy Background -->
  <rect width="180" height="180" rx="40" fill="url(#navyGrad)"/>
  
  <!-- Shine effect overlay -->
  <rect width="180" height="180" rx="40" fill="url(#shine)"/>
  
  <!-- JLITE Brand Mark - Bold JL -->
  <text x="90" y="125" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="90" 
        font-weight="900" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="-6">JL</text>
  
  <!-- Premium Gold Accent Line -->
  <rect x="25" y="145" width="130" height="8" rx="4" fill="url(#goldGrad)" opacity="0.95">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Electrical Circuit Elements (Premium Look) -->
  <g opacity="0.25">
    <circle cx="45" cy="45" r="5" fill="#FFD700"/>
    <circle cx="135" cy="45" r="5" fill="#FFD700"/>
    <line x1="45" y1="45" x2="135" y2="45" stroke="#FFD700" stroke-width="2"/>
    
    <circle cx="45" cy="135" r="5" fill="#FFD700"/>
    <circle cx="135" cy="135" r="5" fill="#FFD700"/>
  </g>
  
  <!-- Subtle border glow -->
  <rect width="180" height="180" rx="40" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>
</svg>
